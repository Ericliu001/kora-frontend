<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />

    <meta name="theme-color" content="#4F46E5" />
    <meta
      name="description"
      content="Onion Loop — a training ground for talking to people. Skills, Emotions, Heart, one unit at a time."
    />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / Facebook / WhatsApp / Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://onionloop.com/course/" />
    <meta property="og:title" content="Onion Loop" />
    <meta
      property="og:description"
      content="A training ground for talking to people. Short, repeatable exercises — someone tells you something real, you reply, and you find out what you caught and what you missed."
    />
    <meta property="og:image" content="https://onionloop.com/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Onion Loop" />

      name="twitter:description"
      content="A training ground for talking to people. Learn one unit at a time."
    />
    <meta name="twitter:image" content="https://onionloop.com/logo.png" />

    <title>Onion Loop</title>

    <!--
      Set the theme before first paint. Without this a dark-mode visitor gets a
      white flash on every load, because React has not mounted yet and the
      stylesheet's light tokens are what the browser paints first.
      Kept in sync with src/hooks/useTheme.ts — same storage key, same fallback.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
